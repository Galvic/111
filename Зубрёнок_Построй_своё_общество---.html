": ["Ромбовидная", "Пирамидальная с широким основанием", "Перевёрнутая пирамида", "Два равных слоя без среднего", "Один слой с одинаковыми позициями"], "answer": 0, "explanation": "В ромбовидной модели преобладают средние слои, в пирамидальной — нижние.", "source": "Раздел 2.Тема 1-3(2)", "page": 8, "difficulty": 3, "id": "Q104", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Общение и конфликты", "type": "choice", "question": "Две команды уступили друг другу часть требований, чтобы согласовать расписание. Какую стратегию они применили?", "options": ["Компромисс", "Сотрудничество с полным удовлетворением интересов", "Приспособление одной стороны", "Избегание обсуждения", "Соперничество"], "answer": 0, "explanation": "Компромисс предполагает взаимные уступки, а не полное удовлетворение интересов каждой стороны.", "source": "Раздел 2.Тема 4-7(2)", "page": 14, "difficulty": 3, "id": "Q105", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Общение и конфликты", "type": "choice", "question": "Посредник предложил сторонам несколько решений, но окончательное соглашение они выбрали добровольно. Как называется этот способ урегулирования?", "options": ["Медиация", "Арбитраж", "Переговоры без третьей стороны", "Соперничество", "Избегание"], "answer": 0, "explanation": "При медиации решение остаётся за сторонами; решение арбитра обязательно для них.", "source": "Раздел 2.Тема 4-7(2)", "page": 14, "difficulty": 3, "id": "Q106", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Общение и конфликты", "type": "choice", "question": "Какая пара средств общения целиком относится к невербальным?", "options": ["Пауза и выражение лица", "Письмо и жест", "Устный рассказ и интонация", "Сообщение в чате и взгляд", "Письменный ответ и темп речи"], "answer": 0, "explanation": "Мимика, интонация, паузы и жесты относятся к невербальным средствам.", "source": "Раздел 2.Тема 4-7(2)", "page": 2, "difficulty": 3, "id": "Q107", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Общение и конфликты", "type": "choice", "question": "Работодатель оценивает незнакомого кандидата только по устойчивому представлению о людях его возраста. Какое явление проявилось?", "options": ["Социальный стереотип", "Индивидуальное наблюдение", "Социальная мобильность", "Ролевой конфликт", "Арбитраж"], "answer": 0, "explanation": "Стереотип — устойчивое упрощённое представление о группе, переносимое на её представителей.", "source": "Раздел 2.Тема 4-7(2)", "page": 5, "difficulty": 3, "id": "Q108", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Коммуникация и социальные процессы", "type": "choice", "question": "Редакция передала сообщение через радио, а затем изучила отклики слушателей. Какие элементы модели коммуникации представлены радио и откликами?", "options": ["Канал и обратная связь", "Коммуникатор и аудитория", "Сообщение и канал", "Аудитория и сообщение", "Обратная связь и коммуникатор"], "answer": 0, "explanation": "Радио служит каналом передачи, отклики показывают результат воздействия и обратную связь.", "source": "Раздел 2.Тема 8-10(2)", "page": 2, "difficulty": 3, "id": "Q109", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Коммуникация и социальные процессы", "type": "choice", "question": "Учитель и ученик обсуждают работу в личном видеозвонке. Как правильно классифицировать общение по участникам и способу контакта?", "options": ["Межличностное, опосредованное", "Массовое, непосредственное", "Межгрупповое, опосредованное", "Межличностное, непосредственное", "Массовое, опосредованное"], "answer": 0, "explanation": "Два конкретных собеседника общаются межличностно, техническое средство опосредует контакт.", "source": "Раздел 2.Тема 8-10(2)", "page": 3, "difficulty": 3, "id": "Q110", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Коммуникация и социальные процессы", "type": "choice", "question": "В учреждении объединяют отделы и перераспределяют функции, сохраняя его деятельность. Какой процесс описан?", "options": ["Реорганизация", "Воспроизводство без изменений", "Дезорганизация", "Миграция", "Социальная стратификация"], "answer": 0, "explanation": "Реорганизация — перестройка существующей организации.", "source": "Раздел 2.Тема 8-10(2)", "page": 5, "difficulty": 3, "id": "Q111", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Коммуникация и социальные процессы", "type": "choice", "question": "Какой набор показателей используется для оценки человеческого развития?", "options": ["Продолжительность жизни, образование, доход на душу населения", "Рождаемость, территория, военные расходы", "Инфляция, занятость, объём экспорта", "Численность населения, миграция, плотность расселения", "Промышленный выпуск, курс валюты, бюджетные расходы"], "answer": 0, "explanation": "Индекс человеческого развития учитывает здоровье через ожидаемую продолжительность жизни, образование и уровень дохода.", "source": "Раздел 2.Тема 8-10(2)", "page": 10, "difficulty": 3, "id": "Q112", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Семья и молодёжь", "type": "choice", "question": "Родители учат ребёнка договариваться и выполнять обещания. Какая функция семьи проявляется прежде всего?", "options": ["Воспитательная", "Репродуктивная", "Хозяйственно-бытовая", "Рекреационная", "Эмоциональная"], "answer": 0, "explanation": "Воспитание связано с освоением норм и социализацией ребёнка.", "source": "Раздел 2.Тема 11-16(2)", "page": 8, "difficulty": 3, "id": "Q113", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Семья и молодёжь", "type": "choice", "question": "Семья организовала совместный отдых для восстановления сил после напряжённой недели. Какую функцию это иллюстрирует?", "options": ["Рекреационную", "Репродуктивную", "Хозяйственно-бытовую", "Воспитательную", "Социально-статусную"], "answer": 0, "explanation": "Рекреационная функция связана с отдыхом и восстановлением здоровья и сил.", "source": "Раздел 2.Тема 11-16(2)", "page": 8, "difficulty": 3, "id": "Q114", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Семья и молодёжь", "type": "choice", "question": "Какая характеристика позволяет рассматривать семью как малую группу?", "options": ["Непосредственное устойчивое общение её членов", "Единые правила для всех семей страны", "Наличие правовых норм о браке", "Общественная потребность в смене поколений", "Закрепление обязанностей в законодательстве"], "answer": 0, "explanation": "Малая группа характеризуется непосредственными устойчивыми контактами участников.", "source": "Раздел 2.Тема 11-16(2)", "page": 6, "difficulty": 3, "id": "Q115", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Семья и молодёжь", "type": "choice", "question": "Дети выросли и стали жить отдельно, супруги продолжают совместную жизнь. Как называется эта стадия семейного цикла?", "options": ["Пустое гнездо", "Молодая семья", "Формирование пары", "Рождение детей", "Распад семьи"], "answer": 0, "explanation": "Пустое гнездо — стадия после ухода взрослых детей из родительской семьи.", "source": "Раздел 2.Тема 11-16(2)", "page": 6, "difficulty": 3, "id": "Q116", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Духовная жизнь", "type": "choice", "question": "Философ сравнивает возможности чувственного и рационального познания. К какому разделу относится его исследование?", "options": ["Гносеологии", "Онтологии", "Эстетике", "Этике", "Философской антропологии"], "answer": 0, "explanation": "Гносеология исследует познание, его возможности и формы.", "source": "Раздел 3. (1)", "page": 15, "difficulty": 3, "id": "Q117", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Духовная жизнь", "type": "choice", "question": "Учёные измерили скорость реакции при разных температурах и записали результаты. К какому уровню относятся эти действия?", "options": ["Эмпирическому", "Теоретическому", "Мировоззренческому", "Нормативному", "Художественному"], "answer": 0, "explanation": "Измерение, наблюдение и эксперимент относятся к эмпирическому уровню исследования.", "source": "Раздел 3. (1)", "page": 19, "difficulty": 3, "id": "Q118", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Духовная жизнь", "type": "choice", "question": "Рецензент проверяет аргументы статьи независимо от известности автора. Какую норму научной деятельности он соблюдает?", "options": ["Универсализм", "Общность научного знания", "Бескорыстность", "Коммерческую результативность", "Приоритет авторитета"], "answer": 0, "explanation": "Универсализм требует оценивать научные положения независимо от личности автора.", "source": "Раздел 3. (1)", "page": 21, "difficulty": 3, "id": "Q119", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Духовная жизнь", "type": "choice", "question": "Одна группа исследует общие законы природы, другая разрабатывает способ очистки воды. Как соотносятся направления их работы?", "options": ["Фундаментальное и прикладное", "Прикладное и фундаментальное", "Оба только фундаментальные", "Оба только прикладные", "Теоретическое и художественное"], "answer": 0, "explanation": "Фундаментальные исследования направлены на общие закономерности, прикладные — на практические задачи.", "source": "Раздел 3. (1)", "page": 19, "difficulty": 3, "id": "Q120", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Основы экономики", "type": "choice", "question": "Предприятие использует речную воду, станки и профессиональные навыки сотрудников. Какая последовательность факторов соответствует этим ресурсам?", "options": ["Земля, капитал, труд", "Капитал, земля, предпринимательство", "Земля, труд, капитал", "Труд, капитал, информация", "Капитал, информация, труд"], "answer": 0, "explanation": "Природные ресурсы относятся к земле; созданные средства производства — к капиталу; способности работников — к труду.", "source": "Раздел 4. Тема 1-3(1)", "page": 3, "difficulty": 3, "id": "Q121", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Основы экономики", "type": "choice", "question": "Собственник передал оборудование другому лицу по договору аренды. Какое правомочие собственника выражено в решении о передаче?", "options": ["Распоряжение", "Пользование", "Владение", "Производство", "Потребление"], "answer": 0, "explanation": "Распоряжение позволяет определять юридическую судьбу имущества, в том числе передавать его в аренду.", "source": "Раздел 4. Тема 1-3(1)", "page": 6, "difficulty": 3, "id": "Q122", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Основы экономики", "type": "choice", "question": "Почему предприятие не может одновременно удовлетворить все возможные потребности покупателей?", "options": ["Ресурсы ограничены при многообразии и росте потребностей", "Потребности ограничены, а ресурсы безграничны", "Все ресурсы одинаково пригодны для любого производства", "Любая потребность обязательно обеспечена предложением", "Производство исключает необходимость выбора"], "answer": 0, "explanation": "Ограниченность ресурсов требует выбирать способы их использования.", "source": "Раздел 4. Тема 1-3(1)", "page": 2, "difficulty": 3, "id": "Q123", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Основы экономики", "type": "choice", "question": "Фирма получает оборудование в долгосрочное пользование с возможностью последующего выкупа. Как называется такая форма отношений?", "options": ["Лизинг", "Банковский депозит", "Страхование", "Налогообложение", "Безвозмездная передача"], "answer": 0, "explanation": "Лизинг предполагает долгосрочную аренду имущества с возможностью выкупа.", "source": "Раздел 4. Тема 1-3(1)", "page": 14, "difficulty": 3, "id": "Q124", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Рынок и конкуренция", "type": "choice", "question": "При установленной цене покупатели готовы купить 80 изделий, а продавцы — предложить 120. Какое состояние рынка возникло?", "options": ["Избыток предложения", "Дефицит товара", "Равновесие", "Рост величины спроса до 120", "Отсутствие предложения"], "answer": 0, "explanation": "Предложение превышает спрос на 40 изделий, возникает избыток товара.", "source": "Раздел 4. Тема 4-6(1)", "page": 4, "difficulty": 3, "id": "Q125", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Рынок и конкуренция", "type": "choice", "question": "Чай и кофе для части покупателей взаимозаменяемы. При прочих равных кофе подорожал. Какое изменение спроса на чай наиболее вероятно?", "options": ["Рост спроса на чай", "Снижение спроса на чай", "Исчезновение спроса на чай", "Спрос на чай обязательно останется прежним", "Рост только предложения чая без изменения спроса"], "answer": 0, "explanation": "Подорожание товара-заменителя может увеличить спрос на альтернативный товар.", "source": "Раздел 4. Тема 4-6(1)", "page": 3, "difficulty": 3, "id": "Q126", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Рынок и конкуренция", "type": "choice", "question": "На рынке много продавцов одинаковой продукции, вход свободен, отдельный продавец не управляет ценой. Какова модель рынка?", "options": ["Совершенная конкуренция", "Монополистическая конкуренция", "Олигополия", "Монополия", "Монопсония"], "answer": 0, "explanation": "Совершенную конкуренцию отличают множество участников, однородный продукт и отсутствие индивидуального контроля цены.", "source": "Раздел 4. Тема 4-6(1)", "page": 6, "difficulty": 3, "id": "Q127", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Рынок и конкуренция", "type": "choice", "question": "Цена товара выросла, доходы покупателей и прочие условия не изменились. Что предсказывает закон спроса?", "options": ["Сокращение величины спроса", "Рост величины спроса", "Обязательное исчезновение спроса", "Неизменность величины спроса для любого товара", "Автоматическое равенство спроса и предложения"], "answer": 0, "explanation": "При прочих равных более высокая цена уменьшает количество товара, которое готовы приобрести покупатели.", "source": "Раздел 4. Тема 4-6(1)", "page": 2, "difficulty": 3, "id": "Q128", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Государство и экономика", "type": "choice", "question": "Страна экспортировала товаров на 90 условных единиц, импортировала на 110. Каково сальдо торгового баланса?", "options": ["Минус 20", "Плюс 20", "Плюс 200", "Минус 200", "Ноль"], "answer": 0, "explanation": "Сальдо равно экспорту за вычетом импорта: 90 − 110 = −20.", "source": "Раздел 4. Тема 7-11(1)", "page": 1, "difficulty": 3, "id": "Q129", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Государство и экономика", "type": "choice", "question": "Денежные накопления семьи не изменились, а общий уровень цен вырос. Что произошло с покупательной способностью этих накоплений?", "options": ["Снизилась", "Возросла", "Осталась прежней", "Стала равна уровню инфляции", "Автоматически восстановилась за счёт роста цен"], "answer": 0, "explanation": "Инфляция уменьшает количество товаров и услуг, которое можно приобрести на неизменную сумму.", "source": "Раздел 4. Тема 7-11(1)", "page": 4, "difficulty": 3, "id": "Q130", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Государство и экономика", "type": "choice", "question": "Какой пример соответствует инновации?", "options": ["Новый способ обработки внедрили и повысили эффективность производства", "Идею нового способа записали, но не проверяли и не применяли", "Предприятие сохранило прежний способ при новом названии отдела", "Работник повторил известную операцию без изменений", "Проект представили, затем отказались от его реализации"], "answer": 0, "explanation": "Для инновации важны внедрение нового решения и повышение эффективности, а не только появление идеи.", "source": "Раздел 4. Тема 7-11(1)", "page": 7, "difficulty": 3, "id": "Q131", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Государство и экономика", "type": "choice", "question": "Сельский район развивает отдых с проживанием в деревне, знакомством с местной природой и традициями. Как называется это направление?", "options": ["Агроэкотуризм", "Промышленная кооперация", "Трудовая миграция", "Финансовый лизинг", "Урбанизация"], "answer": 0, "explanation": "Агроэкотуризм использует природные и культурно-исторические ресурсы сельской местности.", "source": "Раздел 4. Тема 7-11(1)", "page": 11, "difficulty": 3, "id": "Q132", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Право и гражданство", "type": "choice", "question": "Две фирмы заключают договор как юридически равные участники. Какая область права прежде всего регулирует эти отношения?", "options": ["Частное право", "Публичное право", "Конституционное право", "Уголовное право", "Административное право"], "answer": 0, "explanation": "Частное право регулирует отношения юридически равных участников, связанные с частными интересами.", "source": "Раздел 6. Тема 1-2", "page": 2, "difficulty": 3, "id": "Q133", "skill": "Применение понятий и различение близких признаков"}, {"topic": "Право и гражданство", "type": "choice", "question": "Гражданин постоянно живёт за рубежом. Какая характеристика его гражданства сохраняет смысл?", "options": ["Устойчивая правовая связь с государством, выраженная во взаимных правах и обязанностях", "Только фактическое нахождение на территории государства", "Членство в общественном объединении страны", "Совпадение культурных предпочтений с большинством", "Владение недвижимостью на территории страны"], "answer": 0, "explanation": "Гражданство — правовая связь человека с государством; оно не тождественно месту проживания.", "source": "Раздел 6. Тема 1-2", "page": 5, "difficulty": 3, "id": "Q1 икализма?", "options": ["Ориентация на коренное и быстрое преобразование общества", "Обещание лёгкого решения острых проблем с помощью нереальных лозунгов", "Стремление сохранить существующие общественные отношения", "Применение насильственных способов изменения государства", "Ориентация на преобразование общественных отношений"], "answer": 1, "explanation": "Популизм описан как обещание лёгкого решения острых проблем.", "source": "Раздел 5. Тема 5-6", "page": 4, "difficulty": 2}, {"id": "Q031", "topic": "Политические идеологии", "type": "input", "question": "Сторонники преобразований требуют не постепенных перемен, а коренной и быстрой перестройки общества и государства. Назови эту ориентацию одним термином.", "options": "", "answer": "радикализм", "explanation": "Так описывается радикализм в конспекте.", "source": "Раздел 5. Тема 5-6", "page": 4, "difficulty": 1}, {"id": "Q032", "topic": "Международные отношения", "type": "choice", "question": "Что характеризует международное право?", "options": ["Система норм и принципов регулирования отношений участников международных отношений", "Система норм и принципов организации органов власти внутри одного государства", "Совокупность политических обещаний, направленных на получение поддержки населения", "Совокупность моральных оценок поведения государств без правового содержания", "Система правил определения результатов выборов в представительные органы"], "answer": 0, "explanation": "Это определение международного права из конспекта.", "source": "Раздел 5. Тема 7-9", "page": 1, "difficulty": 2}, {"id": "Q033", "topic": "Международные отношения", "type": "choice", "question": "Какой источник международного права назван наряду с международным договором?", "options": ["Международный обычай", "Политическая программа", "Предвыборный лозунг", "Идеологическая доктрина", "Общественное мнение"], "answer": 0, "explanation": "Международные обычаи — один из источников международного права.", "source": "Раздел 5. Тема 7-9", "page": 3, "difficulty": 2}, {"id": "Q034", "topic": "Международные отношения", "type": "choice", "question": "Какое положение верно характеризует международное гуманитарное право?", "options": ["Ограничивает страдания во время конфликта независимо от целей его сторон", "Применяется после завершения конфликта для оценки его экономических итогов", "Применяется в зависимости от признания целей одной стороны справедливыми", "Обязывает только правительства, освобождая остальных участников конфликта", "Заменяет международные договоры при возникновении вооружённого конфликта"], "answer": 0, "explanation": "Международное гуманитарное право направлено на предотвращение или ограничение страданий во время конфликтов.", "source": "Раздел 5. Тема 7-9", "page": 4, "difficulty": 2}, {"id": "Q035", "topic": "Международные отношения", "type": "choice", "question": "В каком году Беларусь стала одним из государств — учредителей ООН?", "options": ["1919", "1939", "1945", "1975", "1991"], "answer": 2, "explanation": "Конспект указывает 1945 год.", "source": "Раздел 5. Тема 7-9", "page": 3, "difficulty": 2}, {"id": "Q036", "topic": "Международные отношения", "type": "input", "question": "Укажи год, к которому относится участие Беларуси в числе 51 государства — учредителя ООН.", "options": "", "answer": "1945", "explanation": "В конспекте указан 1945 год.", "source": "Раздел 5. Тема 7-9", "page": 3, "difficulty": 3}, {"id": "Q037", "topic": "Человек и личность", "type": "matching", "question": "Установи соответствие между понятиями и характеристиками.", "answer": null, "explanation": "Индивид описывает отдельного человека; личность — социальные качества; индивидуальность — неповторимость.", "source": "Раздел 1. Тема 1-6", "page": 3, "difficulty": 2, "pairs": [["Индивид", "Отдельный человек — носитель биологических свойств"], ["Личность", "Человек с социальными и духовными качествами"], ["Индивидуальность", "Отличительные качества и жизненный опыт"]]}, {"id": "Q038", "topic": "Человек и личность", "type": "choice", "question": "Какое утверждение о становлении личности верно?", "answer": 0, "explanation": "Личность характеризуют приобретённые социальные качества, усвоение норм, самостоятельность и ответственность. Биологическое сходство не определяет одинаковый жизненный опыт.", "source": "Раздел 1. Тема 1-6", "page": 3, "difficulty": 2, "options": ["Социальные качества формируются при усвоении норм и участии в жизни общества", "Социальные качества полностью определяются биологическими свойствами при рождении", "Достижение определённого роста означает завершение становления личности", "Изменение телосложения является основным показателем усвоения социальных норм", "Генетическая идентичность гарантирует совпадение жизненного опыта"]}, {"id": "Q039", "topic": "Человек и личность", "type": "order", "question": "Восстанови предложенную в конспекте модель воплощения замысла во взаимодействии людей. Это учебная модель, а не обязательный порядок любого действия.", "answer": null, "explanation": "Конспект приводит последовательность: мысль → слово → действие → результат.", "source": "Раздел 1. Тема 1-6", "page": 2, "difficulty": 1, "steps": ["Мысль", "Слово", "Действие", "Результат"]}, {"id": "Q040", "topic": "Человек и личность", "type": "fix", "question": "Исправь ошибку одним словом: «Адаптация — процесс приобретения индивидом навыков, необходимых для полноценной жизни в обществе».", "answer": "социализация", "explanation": "Вместо «адаптация» требуется «социализация»: именно так определяется процесс приобретения необходимых для жизни в обществе навыков.", "source": "Раздел 1. Тема 1-6", "page": 2, "difficulty": 2}, {"id": "Q041", "topic": "Человек и личность", "type": "case", "question": "За годы взросления человек учится сотрудничать, учитывать правила разных коллективов и отвечать за свои поступки. Назови общий процесс, объединяющий эти изменения.", "answer": "социализация", "explanation": "Социализация — приобретение индивидом навыков, необходимых для полноценной жизни в обществе.", "source": "Раздел 1. Тема 1-6", "page": 2, "difficulty": 2}, {"id": "Q042", "topic": "Культура", "type": "matching", "question": "Соотнеси понятия и их определения.", "answer": null, "explanation": "Знак передаёт смысл, символ — условное обозначение образа или идеи, текст — упорядоченная система знаков.", "source": "Раздел 1. Тема 7-11", "page": 3, "difficulty": 2, "pairs": [["Знак", "Объект, используемый для передачи смысла"], ["Символ", "Знак, условно обозначающий образ или идею"], ["Текст", "Упорядоченная система знаков с информацией"]]}, {"id": "Q043", "topic": "Культура", "type": "matching", "question": "Соотнеси подход к культуре и его характеристику.", "answer": null, "explanation": "Антропологический подход признаёт различные способы и результаты человеческой деятельности; ценностный — лучшие творения духа.", "source": "Раздел 1. Тема 7-11", "page": 1, "difficulty": 2, "pairs": [["Антропологический подход", "Многообразные результаты и способы деятельности"], ["Ценностный подход", "Лучшие творения человеческого духа"]]}, {"id": "Q044", "topic": "Культура", "type": "fix", "question": "Исправь ошибку одним словом: «Ретро — оригинальные вещи предыдущего поколения».", "answer": "винтаж", "explanation": "В конспекте оригинальные вещи предыдущего поколения названы винтажем; ретро — стилизация.", "source": "Раздел 1. Тема 7-11", "page": 4, "difficulty": 2}, {"id": "Q045", "topic": "Культура", "type": "case", "question": "Мастер изготовил новую вещь, воспроизводящую облик предметов прошлого поколения. Покупатель назвал её винтажной. Какой термин следует использовать вместо «винтаж»?", "answer": "ретро", "explanation": "Винтаж предполагает подлинную вещь предыдущего поколения. Современная стилизация под прошлое — ретро.", "source": "Раздел 1. Тема 7-11", "page": 4, "difficulty": 3, "acceptable": ["стиль ретро"]}, {"id": "Q046", "topic": "Общественное развитие", "type": "matching", "question": "Установи соответствие между группой критериев прогресса и тем, что они оценивают.", "answer": null, "explanation": "Группы критериев и объекты оценки представлены в таблице конспекта.", "source": "Раздел 1. Тема 12-18", "page": 2, "difficulty": 3, "pairs": [["Духовные и культурные", "Уровень просвещённости, культуры и нравственности"], ["Личностные и правовые", "Степень свободы личности"], ["Производственно-технические", "Развитие производительных сил и техники"], ["Экономические", "Экономический рост"]]}, {"id": "Q047", "topic": "Общественное развитие", "type": "fix", "question": "Исправь ошибку одним словом: «Регресс — движение к лучшему, более совершенному».", "answer": "прогресс", "explanation": "Движение к лучшему и более совершенному — прогресс. Регресс — движение назад, к худшему.", "source": "Раздел 1. Тема 12-18", "page": 1, "difficulty": 2}, {"id": "Q048", "topic": "Общественное развитие", "type": "case", "question": "В обществе растёт производство, но одновременно снижается уровень нравственности. Назови группу критериев прогресса, по которой выявлена отрицательная динамика.", "answer": "духовные и культурные", "explanation": "Уровень нравственности оценивается духовными и культурными критериями. Рост производства не позволяет считать прогрессивными изменения во всех сферах.", "source": "Раздел 1. Тема 12-18", "page": 2, "difficulty": 3, "acceptable": ["нельзя", "нет нельзя"], "acceptedAnswers": ["духовные и культурные критерии", "духовно-культурные"]}, {"id": "Q049", "topic": "Политика и власть", "type": "matching", "question": "Соотнеси элементы властного отношения и их характеристики.", "answer": null, "explanation": "Субъект — носитель власти; объект — адресат воздействия; средствами служат убеждение, авторитет и принуждение.", "source": "Раздел 5. Тема 1-2", "page": 2, "difficulty": 2, "pairs": [["Субъект власти", "Носитель власти"], ["Объект власти", "Тот, на кого направлено властное воздействие"], ["Средства воздействия", "Убеждение, авторитет, принуждение"]]}, {"id": "Q050", "topic": "Политика и власть", "type": "order", "question": "Восстанови модель властного отношения: от носителя власти через средство воздействия и адресата к важнейшему признаку власти.", "answer": null, "explanation": "По схеме конспекта субъект власти воздействует на объект, что приводит к подчинению.", "source": "Раздел 5. Тема 1-2", "page": 2, "difficulty": 2, "steps": ["Субъект власти", "Воздействие: убеждение, авторитет или принуждение", "Объект власти", "Подчинение"]}, {"id": "Q051", "topic": "Политика и власть", "type": "fix", "question": "Исправь ошибку словосочетанием: «Объект власти — носитель власти, от которого исходят распоряжения».", "answer": "субъект власти", "explanation": "От носителя власти исходят влияние, распоряжения и приказы. Это субъект власти.", "source": "Раздел 5. Тема 1-2", "page": 2, "difficulty": 2}, {"id": "Q052", "topic": "Демократия", "type": "matching", "question": "Соотнеси политико-правовые понятия и их содержание.", "answer": null, "explanation": "Прямая демократия предполагает власть без посредников; представительная — передачу полномочий представителям.", "source": "Раздел 5. Тема 3-4", "page": "1, 7", "difficulty": 3, "pairs": [["Прямая демократия", "Власть без политических посредников"], ["Представительная демократия", "Решения принимают избранные представители"], ["Активное избирательное право", "Право избирать"], ["Пассивное избирательное право", "Право быть избранным"]]}, {"id": "Q053", "topic": "Демократия", "type": "case", "question": "В одном случае решение принимают избранные депутаты, в другом — сами граждане на референдуме. Назови форму демократии во втором случае.", "answer": "прямая демократия", "explanation": "При прямой демократии власть осуществляется самим народом без политических посредников.", "source": "Раздел 5. Тема 3-4", "page": 1, "difficulty": 2, "acceptable": ["прямая"]}, {"id": "Q054", "topic": "Демократия", "type": "fix", "question": "Исправь ошибку словом: «Пассивное избирательное право — право избирать».", "answer": "активное", "explanation": "Активное избирательное право означает право избирать, пассивное — право быть избранным.", "source": "Раздел 5. Тема 3-4", "page": 7, "difficulty": 2}, {"id": "Q055", "topic": "Политические идеологии", "type": "matching", "question": "Соотнеси политические понятия с наиболее точными характеристиками.", "answer": null, "explanation": "Суперидеологии названы на с. 2, определение политической идеологии — на с. 1, различие радикализма и популизма — на с. 4.", "source": "Раздел 5. Тема 5-6", "page": "1–4", "difficulty": 3, "pairs": [["Либерализм, консерватизм, социализм", "Основные суперидеологии"], ["Политическая идеология", "Идеи и ценности социальных слоёв, реализуемые через государственную власть"], ["Радикализм", "Ориентация на коренное и быстрое преобразование"], ["Популизм", "Нереальные обещания лёгкого решения острых проблем"]]}, {"id": "Q056", "topic": "Политические идеологии", "type": "fix", "question": "Исправь ошибку одним словом: «Радикализм — выдвижение нереальных, но популярных лозунгов для получения поддержки».", "answer": "популизм", "explanation": "Так определяется популизм. Радикализм ориентирован на коренное и быстрое изменение общества и государства.", "source": "Раздел 5. Тема 5-6", "page": 4, "difficulty": 3}, {"id": "Q057", "topic": "Международные отношения", "type": "matching", "question": "Соотнеси формы международных актов и отрасль права с их характеристиками.", "answer": null, "explanation": "Принятые договорные обязательства отличаются от обычно рекомендательных деклараций и резолюций. Международное гуманитарное право применяется во время вооружённых конфликтов.", "source": "Раздел 5. Тема 7-9", "page": "3–4", "difficulty": 3, "pairs": [["Международные договоры", "Обязательны для государства, принявшего соответствующие обязательства"], ["Декларации и резолюции межправительственных организаций", "Обычно имеют рекомендательный характер"], ["Международное гуманитарное право", "Применяется в вооружённых конфликтах независимо от целей сторон"]]}, {"id": "Q058", "topic": "Международные отношения", "type": "case", "question": "Участники вооружённого конфликта по-разному оценивают его причины и справедливость. Какая отрасль международного права должна соблюдаться ими независимо от этих оценок?", "answer": "международное гуманитарное право", "explanation": "Это цель международного гуманитарного права, применяемого в вооружённых конфликтах.", "source": "Раздел 5. Тема 7-9", "page": 4, "difficulty": 3}, {"id": "Q059", "topic": "Международные отношения", "type": "fix", "question": "Исправь ошибку: «Беларусь стала одним из государств — учредителей ООН в 1991 году». Впиши только правильный год.", "answer": "1945", "explanation": "Беларусь стала одним из 51 государства — учредителя ООН в 1945 году.", "source": "Раздел 5. Тема 7-9", "page": 3, "difficulty": 1}, {"id": "Q060", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 2, "question": "Какое утверждение о психике соответствует конспекту?", "type": "choice", "answer": 0, "explanation": "Психика — свойство человека или животного субъективно отображать события реальности для ориентации и взаимодействия со средой.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Она присуща человеку и животным с соответствующей организацией нервной системы", "Она возникает у человека только после освоения письменной речи", "Она является приобретённым социальным статусом человека", "Она означает совокупность принятых в обществе правил", "Она совпадает с индивидуальным жизненным опытом"]}, {"id": "Q061", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 2, "question": "Как называются органы восприятия информации, входящие вместе с нервными волокнами и головным мозгом в нервную систему?", "type": "input", "answer": "рецепторы", "explanation": "Рецепторы воспринимают информацию; нервные волокна являются проводящими каналами.", "difficulty": 2, "skill": "Различение понятий и применение знаний"}, {"id": "Q062", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 3, "question": "Два человека генетически идентичны, но выросли в разных условиях. Почему из этого нельзя заключить, что их индивидуальности совпадут?", "type": "choice", "answer": 0, "explanation": "Генетическая идентичность не воспроизводит жизненный опыт, входящий в индивидуальность.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Индивидуальность определяется сочетанием качеств и неповторимого опыта", "Индивидуальность обозначает исключительно строение организма", "Индивидуальность полностью определяется принадлежностью к виду", "Индивидуальность тождественна цвету глаз и волос", "Индивидуальность возникает независимо от общения и деятельности"]}, {"id": "Q063", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 3, "question": "Какая характеристика непосредственно раскрывает понятие «индивид»?", "type": "choice", "answer": 2, "explanation": "Индивид подчёркивает отдельность человека и его биологические свойства; социальные качества характеризуют личность.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Участие в решении общественных проблем", "Осмысленное принятие решений", "Отдельно взятый носитель биологических свойств человека", "Ответственность перед обществом", "Неповторимое сочетание жизненного опыта и качеств"]}, {"id": "Q064", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 2, "question": "Какая пара верно различает биологическую адаптацию и социализацию?", "type": "choice", "answer": 1, "explanation": "В конспекте адаптация определена как приспособление к среде, социализация — как приобретение навыков полноценной жизни в обществе.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Адаптация — усвоение норм; социализация — обмен веществ", "Адаптация — приспособление к среде; социализация — освоение навыков жизни в обществе", "Адаптация — развитие речи; социализация — работа органов чувств", "Адаптация — приобретение статуса; социализация — наследование свойств", "Адаптация — участие в обществе; социализация — строение организма"]}, {"id": "Q065", "topic": "Человек и личность", "source": "Раздел 1. Тема 1-6", "page": 2, "question": "Какая высшая психическая функция мозга позволяет человеку получать результаты, которые становятся доступными другим через устную и письменную речь?", "type": "input", "answer": "мышление", "explanation": "Речь делает результаты мышления доступными другим людям.", "difficulty": 2, "skill": "Различение понятий и применение знаний"}, {"id": "Q066", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 2, "question": "Какой риск возникает, когда одну культуру объявляют единственно правильной?", "type": "choice", "answer": 0, "explanation": "Такое представление может вести к неприятию других культур и ксенофобии.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Неприятие других культур", "Расширение способов декодирования", "Повышение разнообразия культурных кодов", "Признание равнозначности культурных традиций", "Усиление интереса к опыту других культур"]}, {"id": "Q067", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 2, "question": "Назови понятие, обозначающее неприязненное и даже враждебное отношение к иным культурам.", "type": "input", "answer": "ксенофобия", "explanation": "Ксенофобия может становиться основой мировоззрения, отвергающего другие культуры.", "difficulty": 2, "skill": "Различение понятий и применение знаний"}, {"id": "Q068", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 3, "question": "Получатель видит все знаки сообщения, но не понимает смысла. Какого условия понимания ему прежде всего недостаёт?", "type": "choice", "answer": 0, "explanation": "Для понимания текста необходимо распознать культурный код и декодировать сообщение.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Знания культурного кода сообщения", "Возможности увеличить число знаков", "Сведения о физическом весе носителя", "Отказа от собственного культурного опыта", "Замены текста одним случайным знаком"]}, {"id": "Q069", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 2, "question": "Какое утверждение раскрывает два способа существования культуры?", "type": "choice", "answer": 0, "explanation": "Культура охватывает и продукты труда, и живую деятельность по их созданию, распространению и хранению.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Культура существует как процесс и как результат деятельности", "Культура является результатом, а деятельность по созданию в неё не входит", "Культура является процессом, а созданные продукты в неё не входят", "Материальные продукты относятся к культуре, духовные — к природе", "Культура существует независимо от создания и передачи ценностей"]}, {"id": "Q070", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 3, "question": "Какая пара обозначает системы, способные выполнять роль культурного кода?", "type": "choice", "answer": 0, "explanation": "Конспект называет естественный язык, изображение, танец и другие системы передачи смысла.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Естественный язык и танец", "Обмен веществ и рост организма", "Масса тела и цвет волос", "Рефлекс и частота дыхания", "Наследственность и телосложение"]}, {"id": "Q071", "topic": "Культура", "source": "Раздел 1. Тема 7-11", "page": 4, "question": "Какое соотношение характерно для развития культуры?", "type": "choice", "answer": 0, "explanation": "Развитие культуры сочетает воспроизведение опыта и существующих форм с созданием нового.", "difficulty": 2, "skill": "Различение понятий и применение знаний", "options": ["Воспроизведение накопленного опыта сочетается с созданием нового", "Создание нового предполагает устранение лю const PREVIOUS_BANK=[{"id":"Q001","topic":"Человек и личность","type":"choice","question":"Какой процесс объединяет освоение человеком правил общения в семье, школе и других социальных группах?","options":["Социализация","Адаптация организма","Саморегуляция организма","Обмен информацией со средой","Работа органов чувств"],"answer":0,"explanation":"Социализация — процесс приобретения человеческим индивидом навыков, необходимых для полноценной жизни в обществе.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q002","topic":"Человек и личность","type":"choice","question":"Выбери ряд, в котором обе характеристики человека относятся к социальным.","options":["Сознание и саморегуляция","Речь и целенаправленная деятельность","Труд и обмен веществ","Общение и инстинкты","Мышление и строение организма"],"answer":1,"explanation":"В конспекте сознание, речь и общение названы социальными характеристиками человека.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q003","topic":"Человек и личность","type":"choice","question":"Какое сопоставление понятий и характеристик верно?","options":["Индивид — социальные качества; личность — биологические свойства","Личность — неповторимый опыт; индивидуальность — принадлежность к виду","Индивид — биологические свойства; индивидуальность — неповторимый опыт","Индивидуальность — принадлежность к виду; индивид — социальные качества","Личность — биологические свойства; индивидуальность — усвоение норм"],"answer":2,"explanation":"Индивидуальность включает отличительные биологические, психологические и социальные качества, а также жизненный опыт.","source":"Раздел 1. Тема 1-6","page":3,"difficulty":2},{"id":"Q004","topic":"Человек и личность","type":"choice","question":"Какой признак позволяет характеризовать человека именно как личность?","options":["Особенности телосложения","Ответственность за самостоятельно принятые решения","Возрастные особенности организма","Наследственные особенности внешности","Работа органов чувств"],"answer":1,"explanation":"Личность формируется в процессе возрастного развития и социализации.","source":"Раздел 1. Тема 1-6","page":3,"difficulty":2},{"id":"Q005","topic":"Человек и личность","type":"input","question":"Назови процесс, который происходит под влиянием семьи, школы, друзей, искусства и литературы и обеспечивает освоение навыков жизни среди людей.","options":"","answer":"социализация","explanation":"Понятие дано в конспекте в разделе о становлении личности.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q006","topic":"Человек и личность","type":"choice","question":"Выбери ряд, в котором обе характеристики человека относятся к биологическим.","options":["Труд и саморегуляция","Сознание и работа органов чувств","Общение и адаптация организма","Обмен веществ и инстинкты","Речь и особенности организма"],"answer":3,"explanation":"Реакции и инстинкты относятся к биологическим характеристикам.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q007","topic":"Культура","type":"choice","question":"Какая характеристика раскрывает понятие «артефакт» наиболее полно?","options":["Искусственно созданный результат деятельности с физическими свойствами и символическим содержанием","Объект окружающей природы с физическими свойствами, существующий независимо от деятельности человека","Любой объект, воздействующий на органы чувств человека и вызывающий эмоциональный отклик","Унаследованное свойство организма, определяющее особенности взаимодействия человека со средой","Всякое природное явление, которому наблюдатель даёт название и научное объяснение"],"answer":0,"explanation":"Артефакты обладают физическими характеристиками и знаковым, символическим содержанием.","source":"Раздел 1. Тема 7-11","page":2,"difficulty":2},{"id":"Q008","topic":"Культура","type":"choice","question":"Два исследователя спорят о культуре. Первый включает в неё способы деятельности независимо от их нравственной оценки, второй — лучшие творения духа. Как соотносятся их подходы?","options":["Первый — ценностный; второй — антропологический","Первый — антропологический; второй — ценностный","Оба используют антропологический подход","Оба используют ценностный подход","Первый сочетает оба подхода; второй — антропологический"],"answer":1,"explanation":"Антропологический подход рассматривает культуру широко — как результаты и способы человеческой деятельности.","source":"Раздел 1. Тема 7-11","page":1,"difficulty":2},{"id":"Q009","topic":"Культура","type":"choice","question":"Как соотносятся понятия «знак», «символ» и «текст»?","options":["Каждый знак является символом, а каждый символ — текстом","Текст представляет собой один символ без системы знаков","Символ является знаком, а текст — упорядоченной системой знаков","Знак является разновидностью текста, а символ — способом его хранения","Символ и текст не предполагают передачи смысла"],"answer":2,"explanation":"Символу в отличие от обычного знака приписывается более глубокое значение.","source":"Раздел 1. Тема 7-11","page":4,"difficulty":2},{"id":"Q010","topic":"Культура","type":"choice","question":"Первый предмет изготовлен предыдущим поколением, второй создан сейчас и воспроизводит облик старой вещи. Как их обозначить?","options":["Первый — ретро; второй — винтаж","Оба — винтаж","Первый — винтаж; второй — ретро","Оба — ретро","Первый — винтаж; второй не относится к артефактам"],"answer":2,"explanation":"Винтаж — оригинальные вещи предыдущего поколения; ретро — стилизация вещей под предметы прошлого.","source":"Раздел 1. Тема 7-11","page":4,"difficulty":2},{"id":"Q011","topic":"Культура","type":"input","question":"Впиши понятие: упорядоченная система знаков, содержащая закодированную информацию.","options":"","answer":"текст","explanation":"Текст — упорядоченная система знаков, содержащая закодированную информацию.","source":"Раздел 1. Тема 7-11","page":3,"difficulty":2},{"id":"Q012","topic":"Культура","type":"choice","question":"Какое основание позволяет ценностному подходу исключать войны и преступления из культуры?","options":["Они представляют способы человеческой деятельности","Они не соответствуют высоким критериям творений человеческого духа","Они передаются через культурные знаки и символы","Они имеют материальные и духовные проявления","Они возникают в процессе общественного развития"],"answer":1,"explanation":"Ценностный подход рассматривает культуру как лучшие творения человеческого духа.","source":"Раздел 1. Тема 7-11","page":1,"difficulty":2},{"id":"Q013","topic":"Общественное развитие","type":"choice","question":"Какой признак отличает регресс от других изменений?","options":["Переход от низших ступеней к высшим","Изменение темпа развития без оценки его направления","Переход от более высоких форм развития к низшим","Изменение способов организации общественной жизни","Возникновение новых форм человеческой деятельности"],"answer":2,"explanation":"Регресс — движение назад, деградация, изменение к худшему.","source":"Раздел 1. Тема 12-18","page":1,"difficulty":2},{"id":"Q014","topic":"Общественное развитие","type":"choice","question":"Какой вывод о соотношении прогресса и развития обоснован?","options":["Понятия равнозначны: оба обозначают улучшение","Прогресс — изменение, а развитие — отсутствие изменений","Прогресс является развитием, однако развитие может включать ухудшение","Развитие относится к обществу, а прогресс — к отдельной личности","Прогресс оценивают по скорости изменений, развитие — по их масштабу"],"answer":2,"explanation":"В конспекте специально подчёркивается, что не всякое развитие является прогрессом.","source":"Раздел 1. Тема 12-18","page":1,"difficulty":2},{"id":"Q015","topic":"Общественное развитие","type":"choice","question":"Какой показатель соответствует личностным и правовым критериям общественного прогресса?","options":["Уровень просвещённости населения","Развитие производительных сил","Степень свободы личности","Темпы экономического роста","Уровень нравственности"],"answer":2,"explanation":"Личностные  отношения","type":"choice","question":"В каком году Беларусь стала одним из государств — учредителей ООН?","options":["1919","1939","1945","1975","1991"],"answer":2,"explanation":"Конспект указывает 1945 год.","source":"Раздел 5. Тема 7-9","page":3,"difficulty":2},{"id":"Q036","topic":"Международные отношения","type":"input","question":"Укажи год, к которому относится участие Беларуси в числе 51 государства — учредителя ООН.","options":"","answer":"1945","explanation":"В конспекте указан 1945 год.","source":"Раздел 5. Тема 7-9","page":3,"difficulty":3},{"id":"Q037","topic":"Человек и личность","type":"matching","question":"Установи соответствие между понятиями и характеристиками.","answer":null,"explanation":"Индивид описывает отдельного человека; личность — социальные качества; индивидуальность — неповторимость.","source":"Раздел 1. Тема 1-6","page":3,"difficulty":2,"pairs":[["Индивид","Отдельный человек — носитель биологических свойств"],["Личность","Человек с социальными и духовными качествами"],["Индивидуальность","Отличительные качества и жизненный опыт"]]},{"id":"Q038","topic":"Человек и личность","type":"choice","question":"Какое утверждение о становлении личности верно?","answer":0,"explanation":"Личность характеризуют приобретённые социальные качества, усвоение норм, самостоятельность и ответственность. Биологическое сходство не определяет одинаковый жизненный опыт.","source":"Раздел 1. Тема 1-6","page":3,"difficulty":2,"options":["Социальные качества формируются при усвоении норм и участии в жизни общества","Социальные качества полностью определяются биологическими свойствами при рождении","Достижение определённого роста означает завершение становления личности","Изменение телосложения является основным показателем усвоения социальных норм","Генетическая идентичность гарантирует совпадение жизненного опыта"]},{"id":"Q039","topic":"Человек и личность","type":"order","question":"Восстанови предложенную в конспекте модель воплощения замысла во взаимодействии людей. Это учебная модель, а не обязательный порядок любого действия.","answer":null,"explanation":"Конспект приводит последовательность: мысль → слово → действие → результат.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":1,"steps":["Мысль","Слово","Действие","Результат"]},{"id":"Q040","topic":"Человек и личность","type":"fix","question":"Исправь ошибку одним словом: «Адаптация — процесс приобретения индивидом навыков, необходимых для полноценной жизни в обществе».","answer":"социализация","explanation":"Вместо «адаптация» требуется «социализация»: именно так определяется процесс приобретения необходимых для жизни в обществе навыков.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q041","topic":"Человек и личность","type":"case","question":"За годы взросления человек учится сотрудничать, учитывать правила разных коллективов и отвечать за свои поступки. Назови общий процесс, объединяющий эти изменения.","answer":"социализация","explanation":"Социализация — приобретение индивидом навыков, необходимых для полноценной жизни в обществе.","source":"Раздел 1. Тема 1-6","page":2,"difficulty":2},{"id":"Q042","topic":"Культура","type":"matching","question":"Соотнеси понятия и их определения.","answer":null,"explanation":"Знак передаёт смысл, символ — условное обозначение образа или идеи, текст — упорядоченная система знаков.","source":"Раздел 1. Тема 7-11","page":3,"difficulty":2,"pairs":[["Знак","Объект, используемый для передачи смысла"],["Символ","Знак, условно обозначающий образ или идею"],["Текст","Упорядоченная система знаков с информацией"]]},{"id":"Q043","topic":"Культура","type":"matching","question":"Соотнеси подход к культуре и его характеристику.","answer":null,"explanation":"Антропологический подход признаёт различные способы и результаты человеческой деятельности; ценностный — лучшие творения духа.","source":"Раздел 1. Тема 7-11","page":1,"difficulty":2,"pairs":[["Антропологический подход","Многообразные результаты и способы деятельности"],["Ценностный подход","Лучшие творения человеческого духа"]]},{"id":"Q044","topic":"Культура","type":"fix","question":"Исправь ошибку одним словом: «Ретро — оригинальные вещи предыдущего поколения».","answer":"винтаж","explanation":"В конспекте оригинальные вещи предыдущего поколения названы винтажем; ретро — стилизация.","source":"Раздел 1. Тема 7-11","page":4,"difficulty":2},{"id":"Q045","topic":"Культура","type":"case","question":"Мастер изготовил новую вещь, воспроизводящую облик предметов прошлого поколения. Покупатель назвал её винтажной. Какой термин следует использовать вместо «винтаж»?","answer":"ретро","explanation":"Винтаж предполагает подлинную вещь предыдущего поколения. Современная стилизация под прошлое — ретро.","source":"Раздел 1. Тема 7-11","page":4,"difficulty":3,"acceptable":["стиль ретро"]},{"id":"Q046","topic":"Общественное развитие","type":"matching","question":"Установи соответствие между группой критериев прогресса и тем, что они оценивают.","answer":null,"explanation":"Группы критериев и объекты оценки представлены в таблице конспекта.","source":"Раздел 1. Тема 12-18","page":2,"difficulty":3,"pairs":[["Духовные и культурные","Уровень просвещённости, культуры и нравственности"],["Личностные и правовые","Степень свободы личности"],["Производственно-технические","Развитие производительных сил и техники"],["Экономические","Экономический рост"]]},{"id":"Q047","topic":"Общественное развитие","type":"fix","question":"Исправь ошибку одним словом: «Регресс — движение к лучшему, более совершенному».","answer":"прогресс","explanation":"Движение к лучшему и более совершенному — прогресс. Регресс — движение назад, к худшему.","source":"Раздел 1. Тема 12-18","page":1,"difficulty":2},{"id":"Q048","topic":"Общественное развитие","type":"case","question":"В обществе растёт производство, но одновременно снижается уровень нравственности. Назови группу критериев прогресса, по которой выявлена отрицательная динамика.","answer":"духовные и культурные","explanation":"Уровень нравственности оценивается духовными и культурными критериями. Рост производства не позволяет считать прогрессивными изменения во всех сферах.","source":"Раздел 1. Тема 12-18","page":2,"difficulty":3,"acceptable":["нельзя","нет нельзя"],"acceptedAnswers":["духовные и культурные критерии","духовно-культурные"]},{"id":"Q049","topic":"Политика и власть","type":"matching","question":"Соотнеси элементы властного отношения и их характеристики.","answer":null,"explanation":"Субъект — носитель власти; объект — адресат воздействия; средствами служат убеждение, авторитет и принуждение.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2,"pairs":[["Субъект власти","Носитель власти"],["Объект власти","Тот, на кого направлено властное воздействие"],["Средства воздействия","Убеждение, авторитет, принуждение"]]},{"id":"Q050","topic":"Политика и власть","type":"order","question":"Восстанови модель властного отношения: от носителя власти через средство воздействия и адресата к важнейшему признаку власти.","answer":null,"explanation":"По схеме конспекта субъект власти воздействует на объект, что приводит к подчинению.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2,"steps":["Субъект власти","Воздействие: убеждение, авторитет или принуждение","Объект власти","Подчинение"]},{"id":"Q051","topic":"Политика и власть","type":"fix","question":"Исправь ошибку словосочетанием: «Объект власти — носитель власти, от которого исходят распоряжения».","answer":"субъект власти","explanation":"От носителя власти исходят влияние, распоряжения и приказы. Это субъект власти.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2},{"id":"Q052","topic":"Демократия","type":"matching","question":"Соотнеси политико-правовые понятия и их содержание.","answer":null,"explanation":"Прямая демократия предполагает власть без посредников; представительная — передачу полномочий представителям.","source":"Раздел 5. Тема 3-4","page":"1, 7","difficulty":3,"pairs":[["Прямая демократия","Власть без политических посредников"],["Представительная демократия","Решения принимают избранные представители"],["Активное избирательное право","Право избирать"],["Пассивное избирательное право","Право быть избранным"]]},{"id":"Q053","topic":"Демократия","type":"case","question":"В одном случае решение принимают избранные депутаты, в другом — сами граждане на референдуме. Назови форму демократии во втором случае.","answer":"прямая демократия","explanation":"При прямой демократии власть осуществляется самим народом без политических посредников.","source":"Раздел 5. Тема 3-4","page":1,"difficulty":2,"acceptable":["прямая"]},{"id":"Q054","topic":"Демократия","type":"fix","question":"Исправь ошибку словом: «Пассивное избирательное право — право избирать».","answer":"активное","explanation":"Активное избирательное право означает право избирать, пассивное — право быть избранным.","source":"Раздел 5. Тема 3-4","page":7,"difficulty":2},{"id":"Q055","topic":"Политические идеологии","type":"matching","question":"Соотнеси политические понятия с наиболее точными характеристиками.","answer":null,"explanation":"Суперидеологии названы на с. 2, определение политической идеологии — на с. 1, различие радикализма и популизма — на с. 4.","source":"Раздел 5. Тема 5-6","page":"1–4","difficulty":3,"pairs":[["Либерализм, консерватизм, социализм","Основные суперидеологии"],["Политическая идеология","Идеи и ценности социальных слоёв, реализуемые через государственную власть"],["Радикализм","Ориентация на коренное и быстрое преобразование"],["Популизм","Нереальные обещания лёгкого решения острых проблем"]]},{"id":"Q056","topic":"Политические идеологии","type":"fix","question":"Исправь ошибку одним словом: «Радикализм — выдвижение нереальных, но популярных лозунгов для получения поддержки».","answer":"популизм","explanation":"Так определяется популизм. Радикализм ориентирован на коренное и быстрое изменение общества и государства.","source":"Раздел 5. Тема 5-6","page":4,"difficulty":3},{"id":"Q057","t ро"]},{"id":"Q046","topic":"Общественное развитие","type":"matching","question":"Установи соответствие между группой критериев прогресса и тем, что они оценивают.","answer":null,"explanation":"Группы критериев и объекты оценки представлены в таблице конспекта.","source":"Раздел 1. Тема 12-18","page":2,"difficulty":3,"pairs":[["Духовные и культурные","Уровень просвещённости, культуры и нравственности"],["Личностные и правовые","Степень свободы личности"],["Производственно-технические","Развитие производительных сил и техники"],["Экономические","Экономический рост"]]},{"id":"Q047","topic":"Общественное развитие","type":"fix","question":"Исправь ошибку одним словом: «Регресс — движение к лучшему, более совершенному».","answer":"прогресс","explanation":"Движение к лучшему и более совершенному — прогресс. Регресс — движение назад, к худшему.","source":"Раздел 1. Тема 12-18","page":1,"difficulty":2},{"id":"Q048","topic":"Общественное развитие","type":"case","question":"В обществе наблюдаются изменения, но некоторые сферы переживают ухудшение. Можно ли утверждать, что всякое развитие — прогресс?","answer":"нет","explanation":"Всякий прогресс — развитие, но не всякое развитие является прогрессом.","source":"Раздел 1. Тема 12-18","page":1,"difficulty":3,"acceptable":["нельзя","нет нельзя"]},{"id":"Q049","topic":"Политика и власть","type":"matching","question":"Соотнеси элементы властного отношения и их характеристики.","answer":null,"explanation":"Субъект — носитель власти; объект — адресат воздействия; средствами служат убеждение, авторитет и принуждение.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2,"pairs":[["Субъект власти","Носитель власти"],["Объект власти","Тот, на кого направлено властное воздействие"],["Средства воздействия","Убеждение, авторитет, принуждение"]]},{"id":"Q050","topic":"Политика и власть","type":"order","question":"Укажи последовательность элементов властного отношения.","answer":null,"explanation":"По схеме конспекта субъект власти воздействует на объект, что приводит к подчинению.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2,"steps":["Субъект власти","Воздействие: убеждение, авторитет или принуждение","Объект власти","Подчинение"]},{"id":"Q051","topic":"Политика и власть","type":"fix","question":"Исправь ошибку словосочетанием: «Объект власти — носитель власти, от которого исходят распоряжения».","answer":"субъект власти","explanation":"От носителя власти исходят влияние, распоряжения и приказы. Это субъект власти.","source":"Раздел 5. Тема 1-2","page":2,"difficulty":2},{"id":"Q052","topic":"Демократия","type":"matching","question":"Соотнеси политико-правовые понятия и их содержание.","answer":null,"explanation":"Прямая демократия предполагает власть без посредников; представительная — передачу полномочий представителям.","source":"Раздел 5. Тема 3-4","page":1,"difficulty":3,"pairs":[["Прямая демократия","Власть без политических посредников"],["Представительная демократия","Решения принимают избранные представители"],["Активное избирательное право","Право избирать"],["Пассивное избирательное право","Право быть избранным"]]},{"id":"Q053","topic":"Демократия","type":"case","question":"Граждане непосредственно голосуют по вопросу на референдуме. Какую форму демократии иллюстрирует пример?","answer":"прямая демократия","explanation":"При прямой демократии власть осуществляется самим народом без политических посредников.","source":"Раздел 5. Тема 3-4","page":1,"difficulty":2,"acceptable":["прямая"]},{"id":"Q054","topic":"Демократия","type":"fix","question":"Исправь ошибку словом: «Пассивное избирательное право — право избирать».","answer":"активное","explanation":"Активное избирательное право означает право избирать, пассивное — право быть избранным.","source":"Раздел 5. Тема 3-4","page":2,"difficulty":2},{"id":"Q055","topic":"Политические идеологии","type":"matching","question":"Соотнеси идеологические понятия и их признаки.","answer":null,"explanation":"Конспект различает сохранение, изменение, function eligible(b){if(b.topic!==undefined && b.topic!==null)return !!s.completed[TOPICS[b.topic]];return b.need?questCount()>=b.need:true}
function buildingArt(b,lv=1){let type=b.kind,pal={hall:['#68bcca','#2e7196','#f2cf7e'],home:['#efb880','#ae794b','#f6a36a'],museum:['#ebd4a1','#aaa37e','#79b1cf'],lab:['#a4cecf','#76aaa8','#c7e8ec'],council:['#a9b5e6','#6f86bd','#91c2e0'],parliament:['#f9d8a4','#ba8769','#baaad8'],forum:['#eec8bc','#d091ab','#a8d19d'],embassy:['#a9cfcc','#5fa1ab','#95caed'],park:['#abd988','#63a865','#b6e3ad'],tram:['#ffe0a4','#b5a06a','#92b9d8'],academy:['#d7c5e8','#8f7caf','#aedfcf'],tower:['#f8d790','#bb9451','#f1eac1']}[type]||['#aed9c0','#7ea992','#a9cfa1'];
let [wall,trim,roof]=pal;if(b.color){wall=b.color;roof=b.color}let id=b.id;
if(type==='park')return `<svg class="building-svg" viewBox="0 0 170 133" aria-hidden="true"><ellipse cx="85" cy="117" rx="72" ry="13" fill="#567d6980"/><path d="M14 105Q40 85 66 104L116 103Q139 85 159 103L156 116H15Z" fill="#a3df8d"/><rect x="71" y="66" width="10" height="43" rx="3" fill="#946a47"/><circle cx="75" cy="54" r="29" fill="#5bbd74"/><circle cx="56" cy="59" r="19" fill="#3aa36b"/><circle cx="94" cy="59" r="20" fill="#79d98a"/><path d="M100 106v-17l7-11" stroke="#98724c" stroke-width="6" fill="none"/><circle cx="112" cy="70" r="19" fill="#65bf74"/><circle cx="119" cy="55" r="16" fill="#82d38f"/><path d="M34 104h18m-15 4h12" stroke="#fff" stroke-width="4"/><rect x="35" y="94" width="22" height="8" rx="4" fill="#c9a576"/><text x="142" y="97" text-anchor="middle" font-size="17">🌼<\/text><\/svg>`;
if(type==='tram')return `<svg class="building-svg" viewBox="0 0 170 133" aria-hidden="true"><ellipse cx="85" cy="115" rx="78" ry="13" fill="#567d6980"/><path d="M4 107L166 107" stroke="#fff" stroke-width="5" stroke-dasharray="17 13"/><rect x="25" y="56" width="120" height="52" rx="14" fill="${wall}" stroke="${trim}" stroke-width="5"/><rect x="36" y="64" width="34" height="23" rx="5" fill="#e5f8ff"/><rect x="80" y="64" width="32" height="23" rx="5" fill="#e5f8ff"/><rect x="122" y="65" width="13" height="30" rx="3" fill="#e5f8ff"/><path d="M28 93H145" stroke="${trim}" stroke-width="5"/><circle cx="52" cy="107" r="9" fill="#495d78"/><circle cx="115" cy="107" r="9" fill="#495d78"/><path d="M84 53L90 34H130" fill="none" stroke="${trim}" stroke-width="5"/><\/svg>`;
let tall=type==='tower';let hi=tall?88:66;let y=110-hi;let windowRows=tall?4:2;
let roofDraw=type==='forum'?`<path d="M23 ${y+1}Q82 ${y-42} 147 ${y+1}Z" fill="${roof}" stroke="${trim}" stroke-width="3"/>`:`<path d="M18 ${y}L85 ${y-28}L152 ${y}L143 ${y+9}L85 ${y-10}L28 ${y+10}Z" fill="${roof}" stroke="${trim}" stroke-width="3"/>`;
let windows=Array.from({length:windowRows},(_,r)=>Array.from({length:3},(_,c)=>`<rect x="${42+c*30}" y="${y+16+r*(tall?18:22)}" width="14" height="13" rx="2" fill="#e5faff" stroke="${trim}" stroke-width="1.5"/>`).join('')).join('');
let dec=b.district?b.icon:type==='hall'?'⭐':type==='tower'?'🏆':type==='academy'?'📚':type==='museum'?'🎨':type==='parliament'?'⚖️':type==='embassy'?'🌐':type==='lab'?'⚙️':type==='council'?'🗳️':type==='forum'?'💬':'🌿';
return `<svg class="building-svg" viewBox="0 0 170 133" aria-hidden="true"><ellipse cx="85" cy="118" rx="77" ry="12" fill="#54725d6b"/><path d="M20 106h130l11 12H8Z" fill="#a8c0aa"/><rect x="30" y="${y}" width="112" height="${hi}" rx="5" fill="${wall}" stroke="${trim}" stroke-width="3"/>${roofDraw}${windows}<rect x="74" y="88" width="23" height="22" rx="3" fill="${trim}"/><circle cx="92" cy="100" r="2" fill="#f7e6a0"/><path d="M34 111h102" stroke="#e9f2ea" stroke-width="4"/><text x="85" y="${y+8}" text-anchor="middle" font-size="${tall?16:14}">${dec}<\/text>${lv>1?`<text x="139" y="25" font-size="15">${'★'.repeat(Math.min(lv-1,2))}<\/text>`:''}<\/svg>`;
}
function plotHtml(b){let lv=Number(city()[b.id])||0,ok=eligible(b),isBuilt=lv>0,sel=b.id===selectedBuilding;return `<button class="plot ${isBuilt?'developed':ok?'constructable':'needs-study'} ${sel?'focused':''}" data-building="${b.id}" title="${esc(b.name)}" aria-label="${esc(b.name)}: ${isBuilt?'построено, уровень '+lv:ok?'доступно к строительству':'не освоены необходимые темы'}"><div class="terrain"><span class="little-tree">🌳<\/span>${isBuilt?buildingArt(b,lv):`<div class="empty-plot"><span>${ok?'🏗️':'🔒'}<\/span><\/div>`}<span class="little-bush">🌱<\/span><\/div><span class="plot-label">${esc(b.name)}<\/span>${isBuilt?`<span class="tile-level">${lv>1?'★'.repeat(lv):'✓'}<\/span>`:''}<\/button>`}
function chooseBuilding(id){selectedBuilding=id;render();const panel=$('#building-panel');if(panel&&window.innerWidth<900)panel.scrollIntoView({block:'nearest',behavior:'smooth'})}
function construct(id){const b=BUILDINGS.find(x=>x.id===id);if(!b)return;const lv=Number(city()[id])||0;if(!eligible(b)){toast('Сначала освой тему, чтобы открыть постройку');return};if(lv>=(id==='hall'?1:3)){toast('У этой постройки уже максимальный уровень');return};let price=lv===0?b.price:Math.round(b.price*(lv===1?.7:1));if(s.coins<price){toast('Не хватает зубромонет. Заработай их на уроках.');return}s.coins-=price;s.city[id]=lv+1;playSound('build');save();toast(lv?'⭐ Улучшение: '+b.name:'🏘️ Построено: '+b.name);render()}
function buildingPanel(){const b=BUILDINGS.find(x=>x.id===selectedBuilding)||BUILDINGS[0];let lv=Number(city()[b.id])||0,ok=eligible(b);let price=lv===0?b.price:Math.round(b.price*(lv===1?.7:1));const next=lv>=3?'Максимальный уровень':lv?'Улучшить до уровня '+(lv+1):'Построить здание';let reason=b.topic!==undefined&&b.topic!==null?`Для строительства нужно завершить урок «${TOPICS[b.topic]}» с результатом не менее 75%.`:`Для строительства нужно освоить ${b.need||0} темы.`;
return `<section class="city-info" id="building-panel"><div class="mini-city-art">${buildingArt(b,Math.max(lv,1))}<\/div><p class="overline">${lv?'ПОСТРОЕНО · УРОВЕНЬ '+lv:'ПЛАН РАЗВИТИЯ'}<\/p><h2>${esc(b.name)}<\/h2><p class="muted">${esc(b.desc)}<\/p>${lv?`<div class="city-ok">✅ Здание построено${lv>1?' и улучшено':''}<\/div>`:!ok?`<div class="city-require">🔐 ${esc(reason)}<\/div>`:`<div class="city-ok">🔓 Доступно к строительству<\/div>`}<div class="city-panel-buttons">${lv<(b.id==='hall'?1:3)&&ok?`<button class="btn full" data-construct="${b.id}" ${s.coins<price?'disabled':''}>${next} · 🪙 ${price}<\/button>`:''}${b.topic!==null&&b.topic!==undefined?`<button class="btn secondary full" data-topic="${esc(TOPICS[b.topic])}">📚 ${lv?'Повторить':'Изучить'} тему<\/button>`:''}${!ok&&b.need?'<button class="btn secondary full" data-nav="academy">Открыть Академию<\/button>':''}<\/div><p class="tiny">Постройки — игровое поощрение за освоение тем. Они не влияют на баллы ЦТ/ЦЭ.<\/p><\/section>`}
const DISTRICTS=[['center','Центр'],['social','Общество'],['culture','Духовная жизнь'],['economy','Экономика'],['law','Право']];
function cityHome(){let n=builtCount(),mastered=TOPICS.filter(t=>s.completed[t]).length;return `<div class="city-welcome"><div><p class="overline">ИГРОВОЙ МИР · ГРАДОСТРОИТЕЛЬСТВО<\/p><h1>Построй своё общество!<\/h1><p>Зарабатывай зубромонеты, изучай обществоведение и превращай зелёную долину в город знаний.<\/p><button class="btn" data-action="continue">Начать учебный урок →<\/button><\/div><div class="city-welcome-mascot">${mascot()}<span>«Начнём с ратуши!»<\/span><\/div><\/div><div class="city-kpis"><div><strong>${n}/${BUILDINGS.length}<\/strong><span>построек<\/span><\/div><div><strong>${mastered}/${TOPICS.length}<\/strong><span>освоенных тем<\/span><\/div><div><strong>${s.coins} 🪙<\/strong><span>бюджет города<\/span><\/div><div><strong>${Math.min(5,Math.max(1,Math.ceil(n/3)))}<\/strong><span>уровень города<\/span><\/div><\/div><div class="city-layout"><section class="city-world"><div class="city-world-head"><div><p class="overline">ЗЕЛЁНАЯ ДОЛИНА<\/p><h2>Город знаний<\/h2><\/div><span class="tag green">Нажми на участок<\/span><\/div><div class="district-tabs" role="group" aria-label="Районы города">${DISTRICTS.map(([id,name])=>`<button class="btn small ${selectedDistrict===id?'':'secondary'}" data-district="${id}" aria-pressed="${selectedDistrict===id}">${name}</button>`).join('')}</div><div class="city-scene"><div class="river" aria-hidden="true"><\/div><div class="city-grid">${BUILDINGS.filter(b=>(b.district||'center')===selectedDistrict).map(plotHtml).join('')}<\/div><div class="city-park-corner" aria-hidden="true">🌲🌳🌲<\/div><\/div><div class="city-legend"><span>🏗️ Доступно<\/span><span>🔒 Нужно изучить тему<\/span><span>✓ Построено<\/span><\/div><\/section>${buildingPanel()}<\/div><div class="city-bottom"><section class="card"><div class="line"><h3>🏗️ Как развивать город<\/h3><span class="tag gold">Учись → строй → улучшай<\/span><\/div><div class="city-steps"><div><strong>1<\/strong><p>Пройди урок в Академии<\/p><\/div><div><strong>2<\/strong><p>Получи XP и зубромонеты<\/p><\/div><div><strong>3<\/strong><p>Открой здание и построй его<\/p><\/div><\/div><p class="muted">Тематические здания открываются после успешного прохождения соответствующих уроков. Дополнительные объекты требуют освоения нескольких тем.<\/p><\/section><section class="card"><h3>📝 Контрольные испытания<\/h3><p class="muted">Проверяй готовность к экзамену в тренировочном формате. Это учебная тренировка.<\/p><div class="city-rt">${['Тренажер 1','Тренажер 2','Тренажер 3'].map(t=>`<button data-stage="${t}" class="btn secondary small">${t}<\/button>`).join('')}<\/div><p class="tiny">Заработанный XP и ресурсы города не являются оценкой экзаменационной готовности.<\/p><\/section><\/div>`}

const ACH=[['first','🌱','Первый шаг','Заверши первый урок',()=>Number(s.lessons)>0],['five','🎯','Разминка','Пять правильных ответов',()=>hits()>=5],['fifty','📚','Знаток','50 правильных ответов',()=>hits()>=50],['hundred','🏹','Охотник за терминами','100 верных ответов',()=>hits()>=100],['streak3','🔥','Начало серии','Три дня занятий подряд',()=>s.streak>=3],['streak7','🏆','Неделя знаний','Семь дней занятий подряд',()=>s.streak>=7],['week1','🗺️','Первая локация','Освой первую локацию',()=>!!s.completed[TOPICS[0]]],['week3','🧭','Исследователь','Освой три локации',()=>questCount()>=3],['all','👑','Легенда Зубрёнка','Освой семь доступных локаций',()=>TOPICS.every(t=>s.completed[t])],['rt','📝','Первый тренажер','Заверши один тренажер',()=>s.testHistory.length>=1],['rt2','📈','Продолжаем тренировку','Пройди два тренажера',()=>s.testHistory.length>=2],['correct10','🧠','Уверенность','Десять верных ответов',()=>hits()>=10],['correct20','💡','Вдумчивый','20 верных ответов',()=>hits()>=20],['correct30','⭐','Упорство','30 верных ответов',()=>hits()>=30],['correct40','💎','Бриллиант','40 верных ответов',()=>hits()>=40],['review1','🔧','Исправляюсь','Исправь одну ошибку',()=>fixedCount()>=1],['review5','🛠️','Работа над собой','Исправь пять ошибок',()=>fixedCount()>=5],['lesson5','🎓','Пять уроков','Пройди пять уроков',()=>s.lessons>=5],['lesson10','🥇','Десять уроков','Пройди десять уроков',()=>s.lessons>=10],['spend','🎩','Модник','Приобрети аксессуар',()=>s.owned.length>=2],['day1','☀️','Ежедневная цель','Выполни ежедневную цель',()=>s.dailyReward],['xp100','✨','100 XP','Накопи 100 XP',()=>s.xp>=100],['xp500','🌟','500 XP','Накопи 500 XP',()=>s.xp>=500],['xp1000','🌠','1000 XP','Накопи 1000 XP',()=>s.xp>=1000],['politics','🏛️','Политолог','Освой «Политика и власть»',()=>!!s.completed['Политика и власть']],['democracy','🗳️','Демократия','Освой «Демократия»',()=>!!s.completed['Демократия']],['culture','🎭','Культуролог','Освой «Культура»',()=>!!s.completed['Культура']],['global','🌍','Международник','Освой «Международные отношения»',()=>!!s.completed['Международные отношения']],['exam80','🚀','Большой результат','Не менее 80% на тренировочном тесте',()=>s.testHistory.some(x=>x.pct>=80)],['accuracy','🎖️','Точность','80% правильных ответов после 20 попыток',()=>tries()>=20&&hits()/tries()>=.8]];
function awards(xp=0,coins=0){s.xp+=xp;s.coins+=coins;const newA=[];for(const a of ACH){if(!s.achievements.includes(a[0])&&a[4]()){s.achievements.push(a[0]);s.coins+=20;newA.push(a[2])}}save();if(newA.length)toast('🏅 Достижение: '+newA.slice(0,2).join(', '))}
function mascot(cl=''){const access=SHOP.find(x=>x[0]===s.equipped);const mood=screen==='result'?'celebrate':screen==='quiz'?(feedback?(feedback.correct?'happy':'support'):'thinking'):'idle';return `<span role="img" aria-label="Зубрёнок: ${mood==='happy'?'радуется':mood==='support'?'подбадривает':mood==='thinking'?'думает':mood==='celebrate'?'празднует':'приветствует'}" class="mascot-wrap mood-${mood} ${cl}">${BISON_SVG}${access&&access[0]!=='none'?`<span class="hat-emoji" aria-label="${esc(access[1])}">${access[2]}</span>`:''}${mood==='happy'||mood==='celebrate'?'<span class="bison-stars" aria-hidden="true">✦ ✧ ✦</span>':''}</span>`}
let playingSound=null;
function playSound(kind){if(!s.soundEnabled||!SOUNDS[kind])return;try{if(playingSound){playingSound.pause();playingSound.currentTime=0}playingSound=new Audio(SOUNDS[kind]);playingSound.volume=Math.min(1,Math.max(0,Number.isFinite(Number(s.soundVolume))?Number(s.soundVolume):0.45));const p=playingSound.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}

const tabs=[['home','🏙️','Мой город'],['academy','📚','Академия'],['rpg','🦬','Мой Зубрёнок'],['daily','🎯','Миссии'],['ach','🏆','Награды'],['stats','📊','Готовность'],['exams','📝','Тренажеры'],['teacher','⚙️','Учитель']];

><button class="btn secondary full small" data-nav="stats">Посмотреть результаты ↗<\/button><div class="notice">XP — за учебную активность, а освоение тем — по фактическим ответам.<\/div><\/aside><nav class="mobile-nav">${[['home','🏙️','Город'],['academy','📚','Уроки'],['rpg','🦬','Герой'],['ach','🏆','Награды'],['stats','📊','Итоги']].map(([k,ico,n])=>`<button data-nav="${k}" class="${shown===k?'current':''}"><span>${ico}<\/span>${n}<\/button>`).join('')}<\/nav><\/div>`;

function rpg(){let lv=level(),equip=SHOP.find(x=>x[0]===s.equipped)||SHOP[0];let skills=[['📖','Знание понятий',bank.filter(q=>['choice','input'].includes(q.type))],['🧩','Логика и соответствия',bank.filter(q=>['matching','order'].includes(q.type))],['🔎','Поиск ошибок',bank.filter(q=>q.type==='fix')],['💡','Применение знаний',bank.filter(q=>q.type==='case')]];return `<h1>🦬 Прокачка Зубрёнка<\/h1><section class="hero"><div><p class="overline">ПЕРСОНАЖ · УРОВЕНЬ ${lv+1}<\/p><h1>${esc(RANKS[lv])}<\/h1><p>Твой спутник растёт вместе с тобой. Аксессуар: <b>${esc(equip[1])} ${equip[2]}<\/b><\/p><div class="meter"><span style="width:${Math.round(s.xp%350/350*100)}%"><\/span><\/div><p class="muted">${s.xp%350} / 350 XP до следующего уровня<\/p><\/div>${mascot()}<\/section><h2>🌳 Дерево учебных навыков<\/h2><p class="muted">Навыки оцениваются по вопросам соответствующего типа; уровень персонажа зависит от XP.<\/p><div class="skillgrid">${skills.map(([e,n,arr])=>{let known=arr.filter(q=>s.answered[q.id]?.correct>0).length;let p=arr.length?Math.round(100*known/arr.length):0;return `<div class="skillitem"><div class="symbol">${e}<\/div><div><b>${n}<\/b><small>${known}/${arr.length} заданий<\/small><div class="meter"><span style="width:${p}%"><\/span><\/div><\/div><\/div>`}).join('')}<\/div><div class="paneltitle"><h2>🛍️ Аксессуары за зубромонеты<\/h2><span class="tag gold">🪙 ${s.coins}<\/span><\/div><div class="grid3">${SHOP.map(a=>`<div class="shopcard ${s.owned.includes(a[0])?'owned':''}"><div class="symbol">${a[2]}<\/div><b>${esc(a[1])}<\/b><p class="muted">${a[3]?a[3]+' 🪙':'Бесплатно'}<\/p><button class="btn small ${s.owned.includes(a[0])?'secondary':''}" data-buy="${a[0]}" ${s.coins<a[3]&&!s.owned.includes(a[0])?'disabled':''}>${s.equipped===a[0]?'Надето':s.owned.includes(a[0])?'Надеть':'Купить'}<\/button><\/div>`).join('')}<\/div><div class="card" style="margin-top:19px"><h3>⚙️ Мой профиль и сохранения<\/h3><label>Имя учащегося <input class="field" id="studentName" maxlength=" function exams(){return `<h1>📝 Тренажеры<\/h1><section class="hero"><div><p class="overline">ТРЕНАЖЕРЫ ПО ОБЩЕСТВОВЕДЕНИЮ<\/p><h1>Три контрольные точки<\/h1><p class="muted">Проверяй знания на основе ${bank.length} заданий. Во время теста сердечки не расходуются.<\/p><\/div>${mascot()}<\/section>${[['Тренажер 1','Первое испытание','Проверь стартовый уровень'],['Тренажер 2','Проверка прогресса','Сравни результат с первой попыткой'],['Тренажер 3','Генеральная репетиция','Устрой себе итоговую тренировку']].map(([id,n,txt])=>`<div class="examcard line"><div><span class="tag gold">🏰 ${id}<\/span><h3 style="margin:10px 0 4px">${n}<\/h3><p class="muted">${txt} · до 25 вопросов из доступного банка<\/p><\/div><button class="btn blue small" data-stage="${id}">Начать →<\/button><\/div>`).join('')}<div class="notice">Тренажеры используют собственную выборку вопросов. Время, структура и шкала официального ЦТ/ЦЭ здесь не имитируются.<\/div>`}
