function mix(a){return a.map(x=>[x,Math.random()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}
function prepareQuestion(original){const q=JSON.parse(JSON.stringify(original));if(q.type==='choice'){const correct=q.options[q.answer];q.options=mix(q.options);q.answer=q.options.indexOf(correct)}if(q.pairs||q.steps){q.displayOrder=mix((q.pairs||q.steps).map((_,i)=>i));if(q.displayOrder.every((v,i)=>v===i))q.displayOrder.push(q.displayOrder.shift())}return q}
function startQuiz(t,mode='lesson',stage=''){let arr=t==='all'?bank.slice():qFor(t);if(mode==='review'){arr=Object.keys(s.mistakes).filter(id=>s.mistakes[id]>0).map(id=>bank.find(q=>q.id===id)).filter(Boolean)}if(!arr.length){toast('Нет заданий для выбранного режима');return}arr=mix(arr).slice(0,mode==='exam'?25:mode==='review'?15:8).map(prepareQuestion);quiz={topic:t,mode,arr,stage,i:0,correct:0,wrong:0,hearts:mode==='exam'?999:s.hearts||5};screen='quiz';selected=null;feedback=null;render()}
const ty={choice:'Выбор ответа',input:'Впиши термин',matching:'Установи соответствие',order:'Последовательность',fix:'Исправь ошибку',case:'Обществоведческий кейс'};
function quizScreen(){const q=quiz.arr[quiz.i];const exam=quiz.mode==='exam';let widget='';if(q.type==='choice'){widget=`<div class="options">${q.options.map((v,i)=>`<button class="option ${selected===i?'selected':''} ${feedback?(i===q.answer?'correct':selected===i?'wrong':''):''}" data-opt="${i}" ${feedback?'disabled':''}><span class="option-letter">${i+1}<\/span>${esc(v)}<\/button>`).join('')}<\/div>`}else if(['input','fix','case'].includes(q.type)){widget=`<input id="freeanswer" class="field" placeholder="Впиши слово или словосочетание" value="${feedback&&typeof selected==='string'?esc(selected):''}" ${feedback?'disabled':''} autocomplete="off">`}else if(q.type==='matching'){widget=`<p class="muted">Для каждого понятия выбери характеристику. Каждую используй один раз.<\/p>${q.pairs.map((p,i)=>`<label><b>${esc(p[0])}<\/b><select class="field pair" data-index="${i}" ${feedback?'disabled':''}><option value="">Выберите...<\/option>${q.displayOrder.map(j=>{const v=q.pairs[j];return `<option value="${j}" ${Array.isArray(selected)&&selected[i]===String(j)?'selected':''}>${esc(v[1])}<\/option>`}).join('')}<\/select><\/label>`).join('')}`}else if(q.type==='order'){widget=`<p class="muted">Выбери элементы в правильном порядке. Каждый используй один раз.<\/p>${q.steps.map((_,i)=>`<label><b>Позиция ${i+1}<\/b><select class="field step" data-index="${i}" ${feedback?'disabled':''}><option value="">Выберите...<\/option>${q.displayOrder.map(j=>{const v=q.steps[j];return `<option value="${j}" ${Array.isArray(selected)&&selected[i]===String(j)?'selected':''}>${esc(v)}<\/option>`}).join('')}<\/select><\/label>`).join('')}`};
return `<div class="quizbar"><button class="btn ghost small" data-action="quit">← Выйти<\/button><div class="meter"><span style="width:${Math.round(100*quiz.i/quiz.arr.length)}%"><\/span><\/div><b>${quiz.i+1}/${quiz.arr.length}<\/b>${exam?'':'❤️ '+quiz.hearts}<\/div><section class="quiz-card"><div class="line"><span class="tag">${esc(q.topic)} · ${esc(ty[q.type]||q.type)}<\/span><span class="tag purple">Сложность ${Number(q.difficulty)||1}/3<\/span><\/div>${companion()}<h2>${esc(q.question)}<\/h2>${widget}${feedback?`<div class="fb ${feedback.correct?'':'bad'}"><b>${feedback.correct?'✅ Верно!':'🧠 Разберём ошибку'}<\/b>${feedback.correct?'':'<p><b>Правильный ответ:<\/b> '+esc(correctText(q))+'<\/p>'}<p>${esc(q.explanation)}<\/p><p class="tiny">Источник: ${esc(q.source)} · с. ${esc(q.page)} PDF<\/p><\/div><div class="quiz-actions"><button class="btn" data-action="next">${quiz.i+1===quiz.arr.length?'Завершить урок':'Следующий вопрос →'}<\/button><\/div>`:`<div class="quiz-actions"><button class="btn" data-action="check">Проверить ответ →<\/button><\/div>`}<\/section>`}
function correctText(q){return q.type==='choice'?q.options[q.answer]:q.type==='matching'?q.pairs.map(p=>p.join(' — ')).join('; '):q.type==='order'?q.steps.join(' → '):q.answer}
function normalize(v){return String(v).trim().toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/[.!?,:;]+$/,'').replace(/\s+/g,' ')}
function check(){const q=quiz.arr[quiz.i];if(feedback)return;let good=false,value;if(q.type==='choice'){value=selected;if(value===null){toast('Выбери вариант ответа');return}good=+value===+q.answer}else if(q.type==='matching'||q.type==='order'){value=$$(q.type==='matching'?'.pair':'.step').map(x=>x.value);if(value.some(x=>x==='')){toast('Заполни все поля');return}if(new Set(value).size!==value.length){toast('Каждый вариант можно использовать только один раз');return}good=value.every((x,i)=>+x===i)}else{value=$('#freeanswer')?.value.trim()||'';if(!value){toast('Впиши ответ');return}good=[q.answer,...(q.acceptedAnswers||[])].some(a=>normalize(value)===normalize(a))}selected=value;feedback={correct:good};playSound(good?'correct':'retry');quiz[good?'correct':'wrong']++;const rec=s.answered[q.id]||{total:0,correct:0};rec.total++;if(good)rec.correct++;s.answered[q.id]=rec;if(good){if(quiz.mode==='review'&&s.mistakes[q.id]>0){s.mistakes[q.id]=0;s.fixed=(s.fixed||0)+1}awards(10+(rec.total===1?5:0),3)}else{s.mistakes[q.id]=(s.mistakes[q.id]||0)+1;if(quiz.mode!=='exam')quiz.hearts=Math.max(0,quiz.hearts-1)}touch();s.dailyCount++;if(s.dailyCount>=10&&!s.dailyReward){s.dailyReward=true;awards(25,12)}save();render()}
function next(){quiz.i++;feedback=null;selected=null;if(quiz.i>=quiz.arr.length||quiz.hearts<=0)finishQuiz();else render()}
function finishQuiz(){if(!quiz)return;const q=quiz;const pct=Math.round(q.correct/q.arr.length*100);const res={...q,pct};if(q.mode==='lesson'){s.lessons=(s.lessons||0)+1;if(pct>=75){s.completed[q.topic]=true;awards(30,25)}else awards(10,6)}else if(q.mode==='exam'){s.testHistory.push({date:today(),correct:q.correct,total:q.arr.length,pct,stage:q.stage||'Тренажер'});awards(100,30)}else if(q.mode==='review')awards(20,8);s.hearts=5;save();quiz=null;window.__lastResult=res;screen='result';playSound('finish');render()}
function result(){let r=window.__lastResult;if(!r)return home();return `<h1>Урок завершён! 🎉<\/h1><section class="hero"><div><p class="overline">ТВОЙ РЕЗУЛЬТАТ<\/p><h1 style="font-size:46px">${r.pct}%<\/h1><h2>${r.correct} из ${r.arr.length} правильных<\/h2><p class="muted">${r.pct>=75?'Так держать!':'Повторение ошибок поможет укрепить знания.'}<\/p><\/div>${mascot()}<\/section><div class="grid2"><button class="quickcard" data-action="continue"><div class="symbol">🗺️<\/div><b>Продолжить путешествие<\/b><small>Следующая локация<\/small><\/button><button class="quickcard" data-action="review"><div class="symbol">🔧<\/div><b>Поработать над ошибками<\/b><small>Повторить сложные вопросы<\/small><\/button><\/div><div class="notice">Игровые награды отражают активность, но не являются экзаменационными баллами.<\/div>`}
function render(){touch();save();const view=({home,academy,rpg,daily,ach:achievements,stats,exams,teacher,quiz:quizScreen,result})[screen]||home;layout(view())}
function download(name,obj){const str=JSON.stringify(obj,null,2);const u=URL.createObjectURL(new Blob([str],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
let timer;function toast(t){let a=$('#toast');a.textContent=t;a.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>a.classList.remove('show'),3400)}
function importQuestionBank(arr){if(!Array.isArray(arr)||!arr.length)throw Error('Нужен непустой список questions');const seen=new Set(bank.map(q=>q.id));for(const q of arr){if(!q.id||!q.topic||!q.question||!q.type||!q.explanation||!q.source||q.page===undefined||q.answer===undefined)throw Error('Пропущены поля у '+(q.id||'задания'));if(seen.has(q.id))throw Error('Повтор ID '+q.id);if(!TOPICS.includes(q.topic))throw Error('Тема не поддерживается: '+q.topic);if(!['choice','input','fix','case','matching','order'].includes(q.type))throw Error('Неизвестный тип '+q.type);if(q.type==='choice'&&(!Array.isArray(q.options)||q.options.length!==5||!Number.isInteger(q.answer)||q.answer<0||q.answer>4))throw Error('Для выбора нужны пять вариантов и индекс ответа 0..4');if(q.type==='matching'&&(!Array.isArray(q.pairs)||q.pairs.length<2))throw Error('Некорректные пары');if(q.type==='order'&&(!Array.isArray(q.steps)||q.steps.length<2))throw Error('Некорректная последовательность');seen.add(q.id)}bank.push(...arr);try{localStorage.setItem(BKEY,JSON.stringify(bank))}catch(e){storeWorks=false;toast('Сохранение недоступно. Экспортируйте банк JSON.')}render();toast('Импортировано заданий: '+arr.length)}
function bind(){$$('[data-district]').forEach(b=>b.onclick=()=>{selectedDistrict=b.dataset.district;selectedBuilding=BUILDINGS.find(x=>(x.district||'center')===selectedDistrict).id;render()});$$('[data-sound-toggle]').forEach(b=>b.onclick=()=>{s.soundEnabled=!s.soundEnabled;if(!s.soundEnabled&&playingSound)playingSound.pause();save();if(s.soundEnabled)playSound('correct');render()});const vol=$('#soundVolume');if(vol)vol.oninput=()=>{s.soundVolume=Number(vol.value);save()};$$('[data-building]').forEach(b=>b.onclick=()=>chooseBuilding(b.dataset.building));$$('[data-construct]').forEach(b=>b.onclick=()=>construct(b.dataset.construct));$$('[data-topic]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.topic));$$('[data-stage]').forEach(b=>b.onclick=()=>startQuiz('all','exam',b.dataset.stage));$$('[data-opt]').forEach(b=>b.onclick=()=>{selected=+b.dataset.opt;playSound('click');$$('[data-opt]').forEach(x=>x.classList.toggle('selected',x===b))});$$('[data-buy]').forEach(b=>b.onclick=()=>{const a=SHOP.find(x=>x[0]===b.dataset.buy);if(!a)return;if(!s.owned.includes(a[0])){if(s.coins<a[3])return;s.coins-=a[3];s.owned.push(a[0])}s.equipped=a[0];awards();render()});$$('[data-action]').forEach(b=>b.onclick=()=>{const k=b.dataset.action;if(k==='continue'){let t=available().find(t=>!s.completed[t])||available()[0];if(t)startQuiz(t);else nav('academy')}if(k==='review')startQuiz('all','review');if(k==='exam')nav('exams');if(k==='check')check();if(k==='next')next();if(k==='quit'&&confirm('Прервать текущий урок? Уже проверенные ответы сохранятся.'))nav('academy');if(k==='name'){s.name=($('#studentName')?.value.trim()||'Ученик').slice(0,40);save();render()}if(k==='backup')download('zubrenok-progress.json',{type:'zubrenok-progress',version:1,state:s});if(k==='bank-export')download('zubrenok-bank.json',{questions:bank});if(k==='report')download('zubrenok-report.json',{name:s.name,answered:s.answered,mistakes:s.mistakes,completed:s.completed,testHistory:s.testHistory})});const a=$('#animation');if(a)a.onchange=()=>{s.showAnimation=a.checked;save();render()};const restore=$('#restore');if(restore)restore.onchange=async()=>{if(!restore.files.length)return;try{const obj=JSON.parse(await restore.files[0].text());if(obj.type!=='zubrenok-progress'||!obj.state||typeof obj.state!=='object')throw Error('Неверный формат');if(!confirm('Заменить текущий прогресс сохранением?'))return;s={...defaults,...obj.state};city();save();render();toast('Прогресс восстановлен')}catch(e){alert('Ошибка восстановления: '+e.message)}};const file=$('#bankfile');if(file)file.onchange=async()=>{if(!file.files.length)return;try{const obj=JSON.parse(await file.files[0].text());importQuestionBank(Array.isArray(obj)?obj:obj.questions)}catch(e){alert('Ошибка импорта: '+e.message)}}}
render();
})();
</script></body></html>
